# Home Assistant de la familia. Copia en /srv/familia/homeassistant/ y arranca con: docker compose up -d
services:
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    volumes:
      - ./config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: Europe/Madrid
    # Red del host sin publicar puertos: HA escucha solo en 127.0.0.1 y el cortafuegos no abre el 8123.
    # server_host va en config/.storage/http, NO en configuration.yaml (las versiones recientes lo ignoran ahí):
    # ver configuration.example.yaml y «Lo que aprendimos» en el README principal.
    network_mode: host
    restart: unless-stopped
    # Que no afecte a otros servicios del mismo servidor
    mem_limit: 1g
